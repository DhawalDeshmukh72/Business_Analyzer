name: Daily Business Analyst Automated Run

on:
  schedule:
    # Runs daily at 08:00 AM UTC (adjust as needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-daily-analyst:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Business Analyst Pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'fallback' }}
        run: |
          python main.py

      - name: Commit and Push Updated Dataset & Database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add business_data.csv business_data.db daily_pipeline.log email_preview.html || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily business metrics dataset [skip ci]" && git push)
